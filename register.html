<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة - Sahara UniLinks</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container { max-width: 500px; margin: 60px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .auth-tabs { display: flex; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; }
        .tab-btn { flex: 1; text-align: center; padding: 15px; font-weight: bold; cursor: pointer; color: var(--text-light); }
        .tab-btn.active { color: var(--primary-blue); border-bottom: 3px solid var(--primary-blue); margin-bottom: -2px; }
        .auth-form { display: none; animation: fadeInUp 0.4s ease; }
        .auth-form.active { display: block; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Sahara <span>UniLinks</span></div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <div class="auth-tabs">
            <div class="tab-btn active" onclick="switchAuth('login', this)">تسجيل الدخول</div>
            <div class="tab-btn" onclick="switchAuth('register', this)">حساب جديد</div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="login-email" placeholder="example@uca.ma" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; cursor: pointer;">دخول</button>
        </form>

        <!-- نموذج إنشاء حساب -->
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label>الاسم الكامل أو النادي الطلابي</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; cursor: pointer;">إنشاء الحساب</button>
        </form>
    </div>

    <footer>
      <div class="container footer-bottom" style="border:none;"><p>© 2026 Sahara UniLinks</p></div>
    </footer>

    <script src="app.js"></script>
    <script>
        function switchAuth(type, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(type + '-form').classList.add('active');
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            
            // التحقق السري من صلاحيات الإدارة خلف الكواليس
            if(email === 'admin@sahara.ma') {
                localStorage.setItem('sahara_role', 'admin');
                showToast('مرحباً بك، لوحة الإدارة جاهزة');
            } else {
                localStorage.setItem('sahara_role', 'student');
                showToast('تم تسجيل الدخول بنجاح');
            }
            setTimeout(() => window.location.href = 'index.html', 1000);
        });

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            localStorage.setItem('sahara_role', 'student');
            showToast('تم إنشاء الحساب بنجاح');
            setTimeout(() => window.location.href = 'index.html', 1000);
        });
    </script>
</body>
</html>
