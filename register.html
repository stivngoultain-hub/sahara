<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة الآمنة - SaharaVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container { max-width: 500px; margin: 60px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .auth-tabs { display: flex; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; }
        .tab-btn { flex: 1; text-align: center; padding: 15px; font-weight: bold; cursor: pointer; color: var(--text-light); transition: all 0.3s; }
        .tab-btn.active { color: var(--primary-blue); border-bottom: 3px solid var(--primary-blue); margin-bottom: -2px; }
        .auth-form { display: none; animation: fadeInUp 0.4s ease; }
        .auth-form.active { display: block; }
        .security-badge { text-align: center; margin-bottom: 25px; padding: 15px; background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; color: #166534; font-size: 0.9rem; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; font-size: 0.85rem; color: var(--text-light); text-align: right; }
        .checkbox-group input { margin-top: 4px; cursor: pointer; }
        .checkbox-group a { color: var(--primary-blue); text-decoration: underline; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Sahara<span>Verse</span></a>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <div class="security-badge">
            🔒 <strong>بوابة آمنة:</strong> الوصول مقيد للطلبة والباحثين. يرجى استخدام بريدك الجامعي أو الوطني (.ma).
        </div>

        <div class="auth-tabs">
            <div class="tab-btn active" onclick="switchAuth('login', this)">تسجيل الدخول</div>
            <div class="tab-btn" onclick="switchAuth('register', this)">حساب جديد</div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="login-email" placeholder="student@uca.ma" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور المشفرة</label>
                <input type="password" id="login-pass" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; cursor: pointer;">دخول آمن</button>
        </form>

        <!-- نموذج إنشاء حساب -->
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label>الاسم الكامل أو النادي الطلابي</label>
                <input type="text" id="reg-name" placeholder="الاسم الكامل" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني (يجب أن ينتهي بـ .ma)</label>
                <input type="email" id="reg-email" placeholder="example@uca.ma" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور (8 أحرف، أرقام وحروف)</label>
                <input type="password" id="reg-pass" placeholder="********" required>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="privacy-consent" required>
                <label for="privacy-consent">
                    أوافق صراحةً على <a href="#">سياسة الخصوصية</a> وأصرح بموافقتي على معالجة معطياتي وفقاً <strong>للقانون المغربي 09-08</strong> لحماية المعطيات (CNDP).
                </label>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; cursor: pointer;">إنشاء حساب مشفر</button>
        </form>
    </div>

    <footer>
      <div class="container footer-bottom" style="border:none;">
        <p>© 2026 SaharaVerse - جميع البيانات محمية ومشفرة</p>
      </div>
    </footer>

    <script src="app.js"></script>
    <script>
        const ADMIN_EMAIL = 'admin@sahara.ma';
        const ADMIN_PASS = 'Admin2026';
        let usersDB = JSON.parse(localStorage.getItem('sahara_users_db')) || [];

        function switchAuth(type, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(type + '-form').classList.add('active');
        }

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-pass').value;

            if (!email.toLowerCase().endsWith('.ma')) {
                showToast('عذراً! التسجيل متاح فقط للحسابات الجامعية التي تنتهي بـ .ma', 'error');
                return;
            }

            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
            if (!passwordRegex.test(password)) {
                showToast('كلمة المرور ضعيفة: يجب أن لا تقل عن 8 أحرف وتتضمن حروفاً وأرقاماً.', 'error');
                return;
            }

            if (usersDB.some(user => user.email === email)) {
                showToast('هذا البريد الإلكتروني مسجل لدينا بالفعل!', 'error');
                return;
            }

            usersDB.push({ name: name, email: email, password: password, role: 'student' });
            localStorage.setItem('sahara_users_db', JSON.stringify(usersDB));
            localStorage.setItem('sahara_role', 'student');
            localStorage.setItem('sahara_current_user', name);
            
            showToast('تم إنشاء الحساب بنجاح! جاري توجيهك لفضاء الطالب...');
            setTimeout(() => window.location.href = 'index.html', 1500);
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-pass').value;
            
            if(email === ADMIN_EMAIL && password === ADMIN_PASS) {
                localStorage.setItem('sahara_role', 'admin');
                localStorage.setItem('sahara_current_user', 'الإدارة المركزية');
                showToast('مرحباً بك، الاتصال بلوحة الإدارة مشفر وآمن');
                setTimeout(() => window.location.href = 'index.html', 1500);
                return;
            } 
            
            const user = usersDB.find(u => u.email === email && u.password === password);
            if (user) {
                localStorage.setItem('sahara_role', 'student');
                localStorage.setItem('sahara_current_user', user.name);
                showToast(`مرحباً بك مجدداً ${user.name}، تسجيل دخول ناجح.`);
                setTimeout(() => window.location.href = 'index.html', 1500);
            } else {
                showToast('خطأ في بيانات الدخول! البريد أو كلمة المرور غير صحيحة.', 'error');
            }
        });
    </script>
</body>
</html>
