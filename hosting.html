      <div style="display:flex;gap:1rem;flex-wrap:wrap">
        <button class="btn btn-primary" style="flex:1" onclick="sendContact()">إرسال الرسالة</button>
        <button class="btn btn-outline" style="flex:1" onclick="closeContactModal()">إلغاء</button>
      </div>
    </div>
  </div>
</div>
<footer>
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <span data-i18n="footer_rights">© 2026 Sahara UniLinks. جميع الحقوق محفوظة</span>
    </div>
  </div>
</footer>
<script src="js/app.js"></script>
<script>
function switchTab(tabName, btn) {
  document.getElementById('tab-find').style.display   = tabName === 'find'   ? 'block' : 'none';
  document.getElementById('tab-become').style.display = tabName === 'become' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
}
function filterHosts() {
  const city = document.getElementById('host-city-filter').value;
  const spec = document.getElementById('host-spec-filter').value;
  document.querySelectorAll('.host-card').forEach(card => {
    const match = (!city || card.dataset.city === city) && (!spec || card.dataset.spec === spec);
    card.parentElement.style.display = match ? '' : 'none';
  });
}
function contactHost(name) {
  document.getElementById('host-name-display').textContent = name;
  document.getElementById('contact-modal').classList.add('open');
}
function closeContactModal() {
  document.getElementById('contact-modal').classList.remove('open');
}
function sendContact() {
  closeContactModal();
  showToast('تم إرسال رسالتك للمضيف بنجاح! ✉️', 'success');
}
function submitHostForm() {
  showToast('تم تقديم طلب انضمامك كمضيف! سيتم مراجعة طلبك خلال 48 ساعة. 🏠', 'success');
}
document.getElementById('contact-modal').addEventListener('click', function(e) {
  if (e.target === this) closeContactModal();
});
</script>
</body>
</html>
