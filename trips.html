<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السياحة العلمية - SaharaVerse</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Sahara<span>Verse</span></a>
        <ul class="nav-links" id="dynamic-nav-links">
            <li><a href="index.html" data-i18n="nav_home">الرئيسية / الفضاء</a></li>
            <li><a href="trips.html" class="active" data-i18n="nav_trips">السياحة العلمية</a></li>
            <li><a href="events.html" data-i18n="nav_events">الفعاليات</a></li>
            <li><a href="hosting.html" data-i18n="nav_hosting">الاستضافة</a></li>
            <li><button class="settings-btn" onclick="openModal('settings-modal')" title="الإعدادات">⚙️</button></li>
        </ul>
        <button id="auth-btn" class="btn-nav" onclick="window.location.href='register.html'" data-i18n="nav_login">الدخول / التسجيل</button>
    </nav>

    <section class="dashboard-container">
        <h2 style="text-align: center; color: var(--dark-blue); font-size: 2.2rem; margin-bottom: 40px;" data-i18n="trips_title">برامج السياحة العلمية</h2>
        <div class="features-grid">
            <div class="feature-card"><h3 style="color: var(--primary-blue);" data-i18n="trip1_title">دراسة ميدانية: الميناء الأطلسي بالداخلة</h3><p style="margin: 15px 0;" data-i18n="trip1_desc">زيارة لأكبر ورش بنية تحتية.</p><button onclick="applyOpportunity('')" class="btn-primary" data-i18n="btn_book">طلب المشاركة</button></div>
            <div class="feature-card"><h3 style="color: var(--primary-blue);" data-i18n="trip2_title">استكشاف محطة الطاقة بطرفاية</h3><p style="margin: 15px 0;" data-i18n="trip2_desc">رحلة علمية لدراسة مشاريع الانتقال الطاقي.</p><button onclick="applyOpportunity('')" class="btn-primary" data-i18n="btn_book">طلب المشاركة</button></div>
        </div>
    </section>

    <div class="modal-overlay" id="settings-modal"><div class="modal"><div class="modal-header"><h3 data-i18n="settings_title">⚙️ الإعدادات</h3><button class="modal-close" onclick="closeModal('settings-modal')">✕</button></div><div class="modal-body"><div class="form-group"><label data-i18n="settings_lang">لغة المنصة</label><select id="lang-selector" onchange="changeLanguage(this.value)"><option value="ar">العربية (Arabic)</option><option value="fr">Français (French)</option><option value="en">English (English)</option></select></div><button onclick="logout()" class="btn-primary" style="width: 100%; background-color: #ef4444;" data-i18n="settings_logout">تسجيل الخروج</button></div></div></div>
    <footer><div class="container footer-bottom" style="border:none;"><p>© 2026 SaharaVerse</p></div></footer>
    <script src="app.js"></script>
    <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js')); }</script>
</body>
</html>
