<div class="modal-overlay" id="book-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>تأكيد الحجز</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:1.5rem">للحجز في هذه الرحلة يرجى تسجيل الدخول أولاً أو إنشاء حساب جديد.</p>
      <div style="display:flex;gap:1rem;flex-wrap:wrap">
        <a href="register.html" class="btn btn-primary" style="flex:1;justify-content:center">تسجيل جديد</a>
        <a href="dashboard.html" class="btn btn-outline" style="flex:1;justify-content:center">تسجيل الدخول</a>
      </div>
    </div>
  </div>
</div>
<footer>
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <span data-i18n="footer_rights">© 2026 Sahara UniLinks. جميع الحقوق محفوظة</span>
    </div>
  </div>
</footer>
<script src="js/app.js"></script>
<script>
function filterTrips() {
  const city     = document.getElementById('filter-city').value;
  const theme    = document.getElementById('filter-theme').value;
  const duration = document.getElementById('filter-duration').value;
  let visible = 0;
  document.querySelectorAll('.trip-card').forEach(card => {
    const match =
      (!city     || card.dataset.city === city) &&
      (!theme    || card.dataset.theme === theme) &&
      (!duration || card.dataset.duration === duration);
    card.parentElement.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
}
function bookTrip(btn) {
  document.getElementById('book-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('book-modal').classList.remove('open');
}
document.getElementById('book-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
